name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build SimpleKeys App
        run: |
          xcodebuild -project SimpleKeys.xcodeproj \
            -scheme 'SimpleKeys' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            EXPANDED_CODE_SIGN_IDENTITY=''

      - name: Package IPA
        run: |
          mkdir -p payload/Payload
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" payload/Payload/
          cd payload
          zip -r ../SimpleKeys.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKeys-IPA
          path: SimpleKeys.ipa

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases --jq '.[].id' | xargs -I {} gh api -X DELETE repos/${{ github.repository }}/releases/{} || true
          git tag -d nightly 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true

      - name: Get build info
        id: info
        run: |
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: |
            ## SimpleKeys Nightly Build

            **Date**: ${{ steps.info.outputs.date }}
            **Commit**: `${{ steps.info.outputs.sha }}` (${{ github.ref_name }})

            ### Installation
            1. Download `SimpleKeys.ipa` below
            2. Install via SideStore / AltStore
            3. Go to Settings > General > Keyboard > Add New Keyboard > SimpleKeys

            > This is a development build (pre-release). It may contain bugs.

            ---
            *Automated build from `${{ github.ref_name }}` branch*
          prerelease: true
          files: SimpleKeys.ipa
