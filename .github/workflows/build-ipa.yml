name: Build SimpleKeys for SideStore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build SimpleKeys App
        run: |
          xcodebuild -project SimpleKeys.xcodeproj \
            -scheme 'SimpleKeys' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            EXPANDED_CODE_SIGN_IDENTITY=''

      - name: Package IPA
        run: |
          mkdir -p payload/Payload
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" payload/Payload/
          cd payload
          zip -r ../SimpleKeys-SideStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKeys-SideStore-IPA
          path: SimpleKeys-SideStore.ipa

      - name: Generate release tag
        id: tag
        run: |
          TAG="nightly-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "date=$(date +'%Y/%m/%d %H:%M')" >> "$GITHUB_OUTPUT"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "🌙 Nightly Build - ${{ steps.tag.outputs.date }}"
          body: |
            ## 🌙 SimpleKeys Nightly Build

            **ビルド日時**: ${{ steps.tag.outputs.date }} UTC
            **コミット**: `${{ steps.tag.outputs.sha }}` (${{ github.ref_name }})

            ### 📦 インストール方法
            1. 下の `SimpleKeys-SideStore.ipa` をダウンロード
            2. SideStore / AltStore でインストール
            3. 設定 > 一般 > キーボード > 新しいキーボードを追加 から SimpleKeys を有効化

            ### ⚠️ 注意
            これは開発版（pre-release）です。安定版ではありません。

            ---
            *Automated nightly build from `${{ github.ref_name }}` branch*
          prerelease: true
          files: SimpleKeys-SideStore.ipa
